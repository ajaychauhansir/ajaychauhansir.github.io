<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.Com Question Papers | Study Portal</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

header {
    background: linear-gradient(135deg, #8e24aa, #ab47bc);
    color: white;
    padding: 32px 15px;
    text-align: center;
}

header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

header p {
    font-size: 15px;
}

.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 15px;
}

.back {
    display: inline-block;
    text-decoration: none;
    background: #222;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    margin-bottom: 25px;
}

.page-title {
    text-align: center;
    margin-bottom: 25px;
}

.page-title h2 {
    font-size: 25px;
    margin-bottom: 8px;
}

.page-title p {
    color: #666;
}

.semester-box {
    background: white;
    border-radius: 16px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 5px 18px rgba(0,0,0,0.09);
}

.semester-title {
    background: linear-gradient(135deg, #8e24aa, #ab47bc);
    color: white;
    padding: 18px 20px;
    font-size: 20px;
    font-weight: bold;
}

.year-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 18px;
}

.year-card {
    display: block;
    background: #faf5fc;
    border: 1px solid #e1bee7;
    border-radius: 10px;
    padding: 14px 8px;
    text-align: center;
    font-weight: bold;
    color: #8e24aa;
    text-decoration: none;
    transition: 0.2s;
}

.year-card:hover {
    background: #f3e5f5;
    transform: translateY(-2px);
}

footer {
    text-align: center;
    padding: 25px;
    color: #666;
    font-size: 14px;
}

@media (max-width: 600px) {

    .year-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    header h1 {
        font-size: 26px;
    }

}

</style>

</head>

<body>

<header>

<h1>📊 B.Com Question Papers</h1>

<p>Bachelor of Commerce | Semester-wise previous year question papers</p>

</header>

<div class="container">

<a href="question-papers.html" class="back">← Back to Courses</a>

<div class="page-title">

<h2>B.Com — Select Semester</h2>

<p>Select a semester and year to view question papers.</p>

</div>

<div id="semester-container"></div>

</div>

<footer>

© 2026 Study Portal | B.Com Question Papers

</footer>

<script>

/* folder का नाम बिल्कुल GitHub के फ़ोल्डर जैसा होना चाहिए (बड़े-छोटे अक्षर समेत) */

const sem1Years = [
    { name: "2012", folder: "2012" },
    { name: "2016", folder: "2016" },
    { name: "2017", folder: "2017" },
    { name: "2018", folder: "2018" },
    { name: "2019", folder: "2019" },
    { name: "2020", folder: "2020" },
    { name: "2022", folder: "2022" },
    { name: "2023 NEP", folder: "2023-NEP" },
    { name: "2024 NEP", folder: "2024-NEP" },
    { name: "2025 NEP", folder: "2025-NEP" }
];

const sem3Years = [
    { name: "2015", folder: "2015" },
    { name: "2016", folder: "2016" },
    { name: "2017", folder: "2017" },
    { name: "2018", folder: "2018" },
    { name: "2019", folder: "2019" },
    { name: "2021 (JAN)", folder: "2021-Jan" },
    { name: "2021 (JULY)", folder: "2021-July" },
    { name: "2022 (MAY-JUNE)", folder: "2022-May-June" },
    { name: "2022 (DEC)", folder: "2022-Dec" },
    { name: "2023", folder: "2023" },
    { name: "2024 NEP", folder: "2024-NEP" },
    { name: "2025 NEP", folder: "2025-NEP" }
];

const sem5Years = [
    { name: "2015", folder: "2015" },
    { name: "2016", folder: "2016" },
    { name: "2017", folder: "2017" },
    { name: "2018", folder: "2018" },
    { name: "2019", folder: "2019" },
    { name: "2020", folder: "2020" },
    { name: "2021", folder: "2021" },
    { name: "2022", folder: "2022" },
    { name: "2023", folder: "2023" },
    { name: "2024", folder: "2024" },
    { name: "2025 NEP", folder: "2025-NEP" }
];

const yearsBySemester = {
    1: sem1Years,
    3: sem3Years,
    5: sem5Years
};

const container = document.getElementById("semester-container");

/* अभी सिर्फ़ Sem 1, 3, 5 के फ़ोल्डर मौजूद हैं */
for (const semester of [1, 3, 5]) {

    const years = yearsBySemester[semester];

    const semesterBox = document.createElement("div");

    semesterBox.className = "semester-box";

    let yearHTML = "";

    years.forEach(year => {

        const yearLink =
            `BCom/Sem-${semester}/${year.folder}/index.html`;

        yearHTML += `
            <a href="${yearLink}" class="year-card">
                ${year.name}
            </a>
        `;

    });

    semesterBox.innerHTML = `

        <div class="semester-title">
            Semester ${semester}
        </div>

        <div class="year-grid">
            ${yearHTML}
        </div>

    `;

    container.appendChild(semesterBox);
}

</script>

</body>

</html>
