<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Material | Ajay Chauhan</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

/* HEADER */

.header {
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #312e81);
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(15,23,42,0.25);
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.header nav a {
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
}

.header nav a:hover {
    color: #93c5fd;
}

/* HERO */

.hero {
    text-align: center;
    padding: 75px 20px 70px;
    color: white;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(96,165,250,0.35),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(167,139,250,0.35),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #172554,
            #312e81,
            #1e3a8a
        );
}

.hero h1 {
    font-size: 44px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 17px;
    color: #e0e7ff;
}

/* COURSES */

.options {
    max-width: 1100px;
    margin: 60px auto 80px;
    padding: 0 20px;

    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

/* CARD */

.card {
    position: relative;
    overflow: hidden;

    background: white;

    padding: 35px 30px;

    border-radius: 18px;

    text-decoration: none;
    color: #1f2937;

    border: 1px solid #e5e7eb;

    box-shadow: 0 8px 28px rgba(15,23,42,0.08);

    transition: 0.3s;
}

.card:hover {
    transform: translateY(-7px);

    box-shadow:
        0 18px 40px rgba(15,23,42,0.14);
}

/* TOP LINE */

.card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 5px;

    background: linear-gradient(
        90deg,
        #2563eb,
        #06b6d4
    );
}

/* ICON */

.card-icon {
    width: 65px;
    height: 65px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background: #eff6ff;

    font-size: 34px;

    margin-bottom: 20px;
}

/* TITLE */

.card h2 {
    color: #172554;
    font-size: 24px;
    margin-bottom: 12px;
}

/* TEXT */

.card p {
    color: #6b7280;
    font-size: 15px;
    margin-bottom: 22px;
}

/* LINK */

.card span {
    color: #2563eb;
    font-weight: bold;
    font-size: 15px;
}

/* SECOND CARD */

.options .card:nth-child(2)::before {
    background: linear-gradient(
        90deg,
        #7c3aed,
        #a855f7
    );
}

.options .card:nth-child(2) .card-icon {
    background: #f5f3ff;
}

/* FOOTER */

footer {
    background: #0f172a;
    color: #cbd5e1;

    text-align: center;

    padding: 30px 15px;
}

footer p {
    font-size: 14px;
}

/* MOBILE */

@media (max-width: 700px) {

    .header {
        padding: 16px 20px;
    }

    .logo {
        font-size: 22px;
    }

    .hero {
        padding: 60px 20px;
    }

    .hero h1 {
        font-size: 34px;
    }

    .hero p {
        font-size: 15px;
    }

    .options {
        grid-template-columns: 1fr;
        margin-top: 40px;
    }

    .card {
        padding: 30px 24px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="logo">
        Ajay Chauhan
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

    </nav>

</header>


<!-- HERO -->

<section class="hero">

    <h1>
        Study Material
    </h1>

    <p>
        Select your course to access semester-wise
        study material.
    </p>

</section>


<!-- COURSES -->

<section class="options">

    <!-- B.COM -->

    <a href="bcom.html" class="card">

        <div class="card-icon">
            🎓
        </div>

        <h2>
            B.Com
        </h2>

        <p>
            Bachelor of Commerce
            study material.
        </p>

        <span>
            Explore →
        </span>

    </a>


    <!-- MORE COURSES -->

    <div class="card">

        <div class="card-icon">
            📚
        </div>

        <h2>
            More Courses
        </h2>

        <p>
            More courses will be
            added soon.
        </p>

        <span>
            Coming Soon
        </span>

    </div>

</section>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 Ajay Chauhan. All Rights Reserved.
    </p>

</footer>

</body>

</html>
